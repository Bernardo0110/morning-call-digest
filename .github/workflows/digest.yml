name: Morning Call Digest

on:
  schedule:
    # 09:30 horário de Brasília = 12:30 UTC
    # Roda de segunda a sexta
    - cron: '30 12 * * 1-5'
  workflow_dispatch:  # permite rodar manualmente pelo GitHub

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar digest
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
        run: python main.py
